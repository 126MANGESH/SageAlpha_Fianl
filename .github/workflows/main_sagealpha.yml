# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - sagealpha

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: sagealphacontainer.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_6DCEEC25B73B46608C16AF3497B4B9FC }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_17F456665BC34FC7B6AC7099F630D012 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: sagealphacontainer.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_6DCEEC25B73B46608C16AF3497B4B9FC }}/sagealphacontainer/sagealpha-web-app:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5DED3A75B67B44CCA6055AEF1C846CD5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9A5BB030D24448AE83F5AF737AB311FE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3A615E2D45004D65A6241527D192404B }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'sagealpha'
          slot-name: 'Production'
          images: 'sagealphacontainer.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_6DCEEC25B73B46608C16AF3497B4B9FC }}/sagealphacontainer/sagealpha-web-app:${{ github.sha }}'
          