# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - sagealpha

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: sagealphacontainer.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_46F57B92576A4A91B8B257811313B118 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_AB3E45EE91B74751BA957B7CDAEC4799 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: sagealphacontainer.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_46F57B92576A4A91B8B257811313B118 }}/sagealpha-web-app:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_63D2422747314BA4BD85A3426CFC3A2B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4224043BD5C74DFABF9BB5B34838CB28 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AF2C27C6C8AE40EC93B2A2CEF1E3035E }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'sagealpha'
          slot-name: 'Production'
          images: 'sagealphacontainer.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_46F57B92576A4A91B8B257811313B118 }}/sagealpha-web-app:${{ github.sha }}'
          